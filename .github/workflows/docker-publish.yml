name: Docker Publish

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.meta-pretix.outputs.version }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Pretix app image (web + task) ---
      - name: Extract metadata for pretix image
        id: meta-pretix
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push pretix image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: pretix-build
          tags: ${{ steps.meta-pretix.outputs.tags }}
          labels: ${{ steps.meta-pretix.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.PLUGIN_REPO_TOKEN }}

      # --- Nginx image (static files baked in) ---
      - name: Extract metadata for nginx image
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: nginx
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.PLUGIN_REPO_TOKEN }}

  generate-openapi-schema:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: write  # needed for creating releases
      packages: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pretix
          POSTGRES_PASSWORD: pretix
          POSTGRES_DB: pretix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pretix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built Gultix image
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-image.outputs.image_version }}"
          docker pull $IMAGE_URL
          docker tag $IMAGE_URL gultix-schema:local

      - name: Run database migrations
        run: |
          docker run --rm \
            --network host \
            -e PRETIX_DATABASE_BACKEND=postgresql \
            -e PRETIX_DATABASE_HOST=localhost \
            -e PRETIX_DATABASE_NAME=pretix \
            -e PRETIX_DATABASE_USER=pretix \
            -e PRETIX_DATABASE_PASSWORD=pretix \
            -e PRETIX_REDIS_LOCATION=redis://localhost:6379/1 \
            -e PRETIX_CELERY_BACKEND=redis://localhost:6379/2 \
            -e PRETIX_CELERY_BROKER=redis://localhost:6379/3 \
            -e PRETIX_PRETIX_URL=http://localhost \
            -e PRETIX_PRETIX_CURRENCY=IDR \
            gultix-schema:local \
            migrate

      - name: Generate OpenAPI schema
        run: |
          mkdir -p output
          chmod 777 output

          # Start the container in detached mode
          CONTAINER_ID=$(docker run -d \
            --network host \
            -e PRETIX_DATABASE_BACKEND=postgresql \
            -e PRETIX_DATABASE_HOST=localhost \
            -e PRETIX_DATABASE_NAME=pretix \
            -e PRETIX_DATABASE_USER=pretix \
            -e PRETIX_DATABASE_PASSWORD=pretix \
            -e PRETIX_REDIS_LOCATION=redis://localhost:6379/1 \
            -e PRETIX_CELERY_BACKEND=redis://localhost:6379/2 \
            -e PRETIX_CELERY_BROKER=redis://localhost:6379/3 \
            -e PRETIX_PRETIX_URL=http://localhost \
            -e PRETIX_PRETIX_CURRENCY=IDR \
            -v $(pwd)/generate_schema.py:/generate_schema.py:ro \
            -v $(pwd)/output:/output \
            --entrypoint sleep \
            gultix-schema:local \
            86400)

          # Inject the necessary packages into the running container
          docker exec --user root $CONTAINER_ID pip install --no-cache-dir drf-spectacular pyyaml

          # Generate YAML format
          docker exec $CONTAINER_ID python /generate_schema.py --output /output/pretix-openapi.yaml --format yaml

          # Generate JSON format
          docker exec $CONTAINER_ID python /generate_schema.py --output /output/pretix-openapi.json --format json

          # Stop and remove the container
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      - name: Verify schema files exist
        run: |
          echo "=== Generated schema files ==="
          ls -la output/
          echo ""
          echo "=== Schema YAML preview (first 50 lines) ==="
          head -50 output/pretix-openapi.yaml || echo "YAML generation failed"
          echo ""
          echo "=== Schema JSON size ==="
          wc -c output/pretix-openapi.json || echo "JSON generation failed"

      - name: Upload schema as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pretix-openapi-schema
          path: |
            output/pretix-openapi.yaml
            output/pretix-openapi.json

      - name: Copy generated openapi.json to worker directory
        run: |
          mkdir -p openapi-worker/src
          cp output/pretix-openapi.json openapi-worker/src/openapi.json

      - name: Deploy Cloudflare Worker
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'openapi-worker'
